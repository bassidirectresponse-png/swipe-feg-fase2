name: Transcrição automática de vídeos

# Sempre que houver um MP4 novo (subido pelo app) sem transcrição, baixa,
# roda o Whisper (local, sem API key) e grava a transcrição de volta — ela
# aparece automaticamente ao lado do vídeo no app.
# Rede de segurança para arquivos grandes a cada hora + botão manual.

on:
  push:
    branches: [main]
    paths:
      - "scripts/transcrever.py"
      - "scripts/traduzir_transcricoes.py"
      - "scripts/analisar_anuncios.py"
      - "scripts/runtime_config.py"
      - "scripts/requirements-transcricao.txt"
      - ".github/workflows/transcrever-videos.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: transcrever
  cancel-in-progress: false

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      WHISPER_MODEL: small     # tiny/base/small/medium/large-v3 (maior = + preciso, + lento)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-transcricao.txt

      - name: Instalar faster-whisper
        run: pip install -r scripts/requirements-transcricao.txt

      - name: Cache do modelo Whisper
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}

      - name: Validar configuração da automação
        env:
          SUPABASE_BOT_EMAIL: ${{ secrets.SUPABASE_BOT_EMAIL }}
          SUPABASE_BOT_PASSWORD: ${{ secrets.SUPABASE_BOT_PASSWORD }}
        run: |
          test -n "$SUPABASE_BOT_EMAIL"
          test -n "$SUPABASE_BOT_PASSWORD"
          python -c "import sys; sys.path.insert(0, 'scripts'); from runtime_config import supabase_public_config; u, k = supabase_public_config(); assert u and k; print('Configuração pública do Supabase validada')"

      - name: Transcrever vídeos pendentes
        env:
          SUPABASE_BOT_EMAIL: ${{ secrets.SUPABASE_BOT_EMAIL }}
          SUPABASE_BOT_PASSWORD: ${{ secrets.SUPABASE_BOT_PASSWORD }}
          APP_URL: "https://benchmarkinggrupofeg.site"
          TRANSCRIBE_KINDS: "criativo,megabrain"
          MAX_VIDEOS: "200"
          MAX_RUN_MINUTES: "300"
          MAX_RETRIES: "8"
          # Um worker interrompido não pode deixar o card preso por horas.
          # Como a rede de segurança roda de hora em hora, 45 min recupera
          # o item já no ciclo seguinte sem disputar com uma execução ativa.
          TRANSCRIPTION_LOCK_MINUTES: "45"
          TRANSCRIPTION_VERSION: "1"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/transcrever.py

      - name: Traduzir transcrições para português
        if: always()
        env:
          SUPABASE_BOT_EMAIL: ${{ secrets.SUPABASE_BOT_EMAIL }}
          SUPABASE_BOT_PASSWORD: ${{ secrets.SUPABASE_BOT_PASSWORD }}
          TRANSLATE_KINDS: "criativo,megabrain"
          TRANSLATION_LOCK_MINUTES: "45"
          MAX_TRANSLATIONS: "80"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/traduzir_transcricoes.py

      - name: Dissecar anúncios curtos já transcritos
        if: always()
        env:
          SUPABASE_BOT_EMAIL: ${{ secrets.SUPABASE_BOT_EMAIL }}
          SUPABASE_BOT_PASSWORD: ${{ secrets.SUPABASE_BOT_PASSWORD }}
          APP_URL: "https://benchmarkinggrupofeg.site"
          AD_ANALYSIS_KINDS: "criativo,megabrain"
          MAX_AD_ANALYSES: "20"
          AD_ANALYSIS_LOCK_MINUTES: "45"
          PYTHONUNBUFFERED: "1"
        run: python -u scripts/analisar_anuncios.py
