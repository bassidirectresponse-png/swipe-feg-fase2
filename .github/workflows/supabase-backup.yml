name: Backup lógico do Swipe

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: supabase-logical-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Exportar metadados e manifesto de mídia
        env:
          SUPABASE_BOT_EMAIL: ${{ secrets.SUPABASE_BOT_EMAIL }}
          SUPABASE_BOT_PASSWORD: ${{ secrets.SUPABASE_BOT_PASSWORD }}
          BACKUP_DIR: .backups
        run: node scripts/backup_supabase_metadata.mjs

      - name: Guardar backup por 30 dias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swipe-supabase-${{ github.run_id }}
          path: .backups/*
          if-no-files-found: error
          retention-days: 30
