name: Notícias 24h — ingestão diária

# Roda todo dia às 09:00 UTC (06:00 BRT) e também sob demanda pela aba Actions.
# Diferente das rotinas da nuvem (CCR), os runners do GitHub Actions têm
# internet liberada, então conseguem gravar no Supabase sem bloqueio de egress.

on:
  schedule:
    - cron: "0 9 * * *"      # 09:00 UTC = 06:00 America/Sao_Paulo
  workflow_dispatch: {}        # botão "Run workflow" para disparo manual

permissions:
  contents: read
  id-token: write

concurrency:
  group: noticias-24h
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Criar sessão temporária de baixo privilégio
        shell: bash
        run: |
          OIDC_RESPONSE="$(curl --fail --silent --show-error -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=swipe-feg-netlify-automation")"
          OIDC_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_RESPONSE")"
          SESSION_RESPONSE="$(curl --fail --silent --show-error -X POST -H "Authorization: Bearer $OIDC_TOKEN" https://swipe.fegsys.com/.netlify/functions/github-automation-token)"
          ACCESS_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<< "$SESSION_RESPONSE")"
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "::add-mask::$OIDC_TOKEN"
          echo "SUPABASE_BOT_ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
          echo "NEWS_INGEST_OIDC_TOKEN=$OIDC_TOKEN" >> "$GITHUB_ENV"

      - name: Ingerir notícias (RSS → Supabase)
        run: python3 scripts/noticias_ingest.py
